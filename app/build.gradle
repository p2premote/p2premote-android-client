plugins {
    id "com.android.application"
    id "jacoco"
}

// JVM-only compatibility coverage; no emulator or native build is required.
jacoco { toolVersion = "0.8.12" }
configurations.matching { it.name in ["jacocoAgent", "jacocoAnt"] }.configureEach {
    resolutionStrategy.eachDependency {
        if (requested.group == "org.jacoco") useVersion "0.8.12"
    }
}
tasks.withType(Test).configureEach {
    jacoco { includes = ["top.p2premote.android.*"] }
}
tasks.register("compatibilityCoverage", JacocoReport) {
    dependsOn "testDebugUnitTest"
    executionData fileTree(layout.buildDirectory).include("jacoco/testDebugUnitTest.exec")
    sourceDirectories.setFrom(files("src/main/java"))
    classDirectories.setFrom(fileTree(layout.buildDirectory.dir("intermediates/javac/debug/classes")) {
        include "top/p2premote/android/SignalTransport.class"
    })
    reports {
        html.required = true
        xml.required = true
    }
}
tasks.register("compatibilityCoverageCheck", JacocoCoverageVerification) {
    dependsOn "compatibilityCoverage"
    def report = tasks.named("compatibilityCoverage", JacocoReport)
    executionData.from(report.map { it.executionData })
    classDirectories.from(report.map { it.classDirectories })
    violationRules {
        rule {
            limit {
                counter = "BRANCH"
                minimum = 1.0
            }
        }
    }
}
tasks.register("unitTestCoverage", JacocoReport) {
    dependsOn "testDebugUnitTest"
    executionData fileTree(layout.buildDirectory).include("jacoco/testDebugUnitTest.exec")
    sourceDirectories.setFrom(files("src/main/java"))
    classDirectories.setFrom(fileTree(layout.buildDirectory.dir("intermediates/javac/debug/classes")) {
        include "top/p2premote/android/**/*.class"
        exclude '**/BuildConfig.class', '**/R.class', '**/R$*.class'
    })
    reports {
        html.required = true
        xml.required = true
    }
}

// Per-class policy targets supplement, rather than replace, the full application report.
def corePolicyClasses = ["SignalTransport", "NetworkRecoveryPolicy", "HealthFrameCodec",
        "TraversalRoundError", "AppException", "ClientVersionPolicy", "PasswordValidator",
        "VerificationCodeValidator", "TraversalPolicy"]
tasks.register("corePolicyCoverage", JacocoReport) {
    dependsOn "testDebugUnitTest"
    executionData fileTree(layout.buildDirectory).include("jacoco/testDebugUnitTest.exec")
    sourceDirectories.setFrom(files("src/main/java"))
    classDirectories.setFrom(fileTree(layout.buildDirectory.dir("intermediates/javac/debug/classes")) {
        corePolicyClasses.each { include "top/p2premote/android/${it}.class" }
    })
    reports {
        html.required = true
        xml.required = true
    }
}
tasks.register("corePolicyCoverageCheck", JacocoCoverageVerification) {
    dependsOn "corePolicyCoverage"
    def report = tasks.named("corePolicyCoverage", JacocoReport)
    executionData.from(report.map { it.executionData })
    classDirectories.from(report.map { it.classDirectories })
    violationRules {
        rule {
            element = "CLASS"
            limit {
                counter = "BRANCH"
                minimum = 0.95
            }
        }
    }
}

def buildVersionProperty = providers.gradleProperty("p2premoteClientVersion")
if (!buildVersionProperty.isPresent()) {
    throw new GradleException("p2premoteClientVersion is required; use build.ps1 -v <version>")
}
def buildVersionName = buildVersionProperty.get()

android {
    testCoverage { jacocoVersion = "0.8.12" }
    namespace "top.p2premote.android"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "top.p2premote.android"
        // minSdk 29 (Android 10): 系统原生支持 TLS 1.3，无需 Conscrypt/ISRG Root X1 兼容层。
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName buildVersionName
        testInstrumentationRunner "top.p2premote.android.SignalInstrumentation"
        buildConfigField "boolean", "SIGNAL_WS_ENABLED", providers.gradleProperty("p2premoteSignalWsEnabled").getOrElse("true")

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets.test.resources.srcDir("../../p2premote-punch-rs/testdata")

    buildTypes {
        release {
            // 当前发行包与调试包共用本机 Gradle debug keystore，确保生成的
            // release APK 可直接安装。后续升级必须继续使用同一份 keystore。
            signingConfig signingConfigs.debug
            // 启用 R8 代码裁剪/混淆。gomobile 绑定类通过 JNI 反射调用，
            // 必须用 proguard-rules.pro keep 保护，否则 release 包必崩。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

// native 构建脚本按宿主 OS 选择：Windows 走 PowerShell 脚本（rust 缓存在
// N:\rust-cache），Linux/macOS（CI、开源贡献者）走等价的 bash 脚本。
def hostIsWindows = System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows")
def nativeScriptCommand = { String scriptName ->
    hostIsWindows
            ? ["powershell", "-ExecutionPolicy", "Bypass", "-File", "scripts/${scriptName}.ps1"]
            : ["bash", "scripts/${scriptName}.sh"]
}

// 测速使用独立的 Rust riperf3 JNI 库；只构建 app 时自动确保两个 ABI 都存在。
tasks.register("buildRiperf3Native", Exec) {
    workingDir rootProject.projectDir
    commandLine nativeScriptCommand("build-riperf3-native")
}

// P2P 打洞层为 Rust 版 gonc（p2premote-punch-rs-gonc 的 JNI 绑定）。
tasks.register("buildPunchNative", Exec) {
    workingDir rootProject.projectDir
    commandLine nativeScriptCommand("build-punch-native")
}

tasks.named("preBuild").configure {
    dependsOn(tasks.named("buildRiperf3Native"))
    dependsOn(tasks.named("buildPunchNative"))
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation fileTree(dir: "libs", include: ["*.aar"])
    // 支持主动发送协议 Ping 并接收 Pong 回调；用于与桌面端一致的 WS 就绪状态机。
    implementation "org.java-websocket:Java-WebSocket:1.6.0"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
