android.suppressUnsupportedCompileSdk=35

# 版本基线：CI push 构建读此处（build.ps1 会追加短提交号，如 1.0.0-69ff294）；
# 本地构建用 build.ps1 -v 传入，发版时手动同步更新
p2premoteBaseVersion=1.0.0

# Gradle 配置
# Android Gradle Plugin 8.x 需要 JDK 17+，Gradle 从 JAVA_HOME / PATH 解析 JDK；
# 本机专属的 org.gradle.java.home 路径请配置在用户级 ~/.gradle/gradle.properties。

# 构建性能
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
