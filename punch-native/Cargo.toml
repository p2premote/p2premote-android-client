[package]
name = "p2premote-punch-jni"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

# 独立于桌面 workspace：避免将 Windows/Linux service 代码带进 Android JNI 库。
[workspace]

[dependencies]
jni = "0.21"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[dependencies.p2premote-punch]
path = "../../p2premote-punch-rs-gonc"
default-features = false
